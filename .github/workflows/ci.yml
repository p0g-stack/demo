name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the native-android branch
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      # tool/rust.sh (run by bootstrap) needs frb codegen at flutter_p0g's
      # base commit. Without flutter_p0g's patched frb (a private repo) it
      # builds the native library only; the web build falls back to Dart.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - uses: actions/cache@v4
        id: frb
        with:
          path: ~/.frb-codegen
          key: frb-codegen-848e438c561491adcc16cbf8b33bb61e541bd475
      - name: frb codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: >
          cargo install --locked --root ~/.frb-codegen
          --git https://github.com/fzyzcjy/flutter_rust_bridge
          --rev 848e438c561491adcc16cbf8b33bb61e541bd475
          flutter_rust_bridge_codegen
      - run: echo "$HOME/.frb-codegen/bin" >> "$GITHUB_PATH"
      # The workspace must still be what p0g_app generates (tool/regen.allow).
      - run: dart pub global activate mason_cli 0.1.4
      - run: tool/regen.sh
      # Patched Squadron, pub get, codegen, web/, web workers, format.
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      # Cargo.lock records where frb was patched from (a local path or git).
      - run: git diff --exit-code -- . ':!rust/Cargo.lock'
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: core
      - run: dart test
        working-directory: cli
      - run: flutter test
        working-directory: app
      # No CDN: WebUI pages are offline, so CanvasKit ships with the app.
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: app/build/web
      # The crate for the root process on Android, for flutter_p0g to pack
      # beside the CLI as bin/<abi>/libdemo_native.so.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo ndk -t arm64-v8a -t x86_64 -o "$PWD/../build/native-android" build --release
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: demo-native-android
          path: build/native-android
      # The same libraries on a branch, since Actions artifacts can't be
      # fetched from everywhere; one commit, replaced on each push to main.
      - name: Publish native-android branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          src="$GITHUB_SHA"
          cd build/native-android
          sha256sum */libdemo_native.so > SHA256SUMS
          echo "# built from p0g-stack/demo $src" >> SHA256SUMS
          git init -q -b native-android
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "libdemo_native.so for Android from $src"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" native-android
