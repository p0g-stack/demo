name: ci

on:
  push:
    branches: [main]
  pull_request:

# flutter_p0g for the module and web jobs: patched frb, build webui, build web.
env:
  FLUTTER_P0G_REF: e5d74c62879e79efaca6bd86db4b85bb36237904

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the native-android branch
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      # The checks use frb codegen at flutter_p0g's base commit, so the
      # committed pubspec.lock (frb by git) stays as is; the module job
      # below builds with flutter_p0g's patched frb.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - uses: actions/cache@v4
        id: frb
        with:
          path: ~/.frb-codegen
          key: frb-codegen-848e438c561491adcc16cbf8b33bb61e541bd475
      - name: frb codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: >
          cargo install --locked --root ~/.frb-codegen
          --git https://github.com/fzyzcjy/flutter_rust_bridge
          --rev 848e438c561491adcc16cbf8b33bb61e541bd475
          flutter_rust_bridge_codegen
      - run: echo "$HOME/.frb-codegen/bin" >> "$GITHUB_PATH"
      # The workspace must still be what p0g_app generates (tool/regen.allow).
      - run: dart pub global activate mason_cli 0.1.4
      - run: tool/regen.sh
      # Patched Squadron, pub get, codegen, web/, web workers, format.
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      # Cargo.lock records where frb was patched from (a local path or git).
      - run: git diff --exit-code -- . ':!rust/Cargo.lock'
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: core
      - run: dart test
        working-directory: cli
      - run: flutter test
        working-directory: app
      # No CDN: WebUI pages are offline, so CanvasKit ships with the app.
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: app/build/web
      # The crate for the root process on Android, for flutter_p0g to pack
      # beside the CLI as bin/<abi>/libdemo_native.so.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo ndk -t arm64-v8a -t x86_64 -o "$PWD/../build/native-android" build --release
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: demo-native-android
          path: build/native-android
      # The same libraries on a branch, since Actions artifacts can't be
      # fetched from everywhere; one commit, replaced on each push to main.
      - name: Publish native-android branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          src="$GITHUB_SHA"
          cd build/native-android
          sha256sum */libdemo_native.so > SHA256SUMS
          echo "# built from p0g-stack/demo $src" >> SHA256SUMS
          git init -q -b native-android
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "libdemo_native.so for Android from $src"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" native-android

  # The WebUI module, packed by flutter_p0g as a developer would: patched frb
  # (native and single-threaded wasm), flutter-webui, the Dart Android kits,
  # and the Android crate from the build job beside the root process.
  module:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the module branch
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,wasm-pack
      - id: cache
        run: echo "dir=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")/bin/cache/flutter_p0g" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: flutter-p0g-${{ env.FLUTTER_P0G_REF }}
      - run: dart pub global activate --source git https://github.com/p0g-stack/flutter_p0g --git-ref "$FLUTTER_P0G_REF"
      - run: flutter_p0g precache --frb --webui --dart-android --dart-android-abi=arm64-v8a,x86_64
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      - uses: actions/download-artifact@v4
        with:
          name: demo-native-android
          path: build/native-android
      # The module's app-plane APK is signed with a stable key when the repo
      # has one (secrets WEBUI_KEYSTORE_B64, a base64 PKCS12 keystore, and
      # WEBUI_KEYSTORE_PASSWORD, store and key password alike, alias
      # WEBUI_KEY_ALIAS); without them flutter_p0g signs with a fresh debug
      # key, and an update over an installed module app fails. The files go
      # in android/ and the runner's temp dir, never webui/: build webui
      # zips everything in webui/ into the public module.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.WEBUI_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WEBUI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WEBUI_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No WEBUI_KEYSTORE_B64 secret: the app-plane APK gets a debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          mkdir -p app/android
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-webui}"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > app/android/key.properties
      # Each push to main is a release: 0.<minor> from the app's pubspec,
      # the run number as patch and versionCode, so the manager's update
      # button sees every one as newer.
      - id: version
        run: |
          base=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
          echo "name=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - run: >
          flutter_p0g build webui --device-rust-libs="$PWD/../build/native-android"
          --build-name=${{ steps.version.outputs.name }} --build-number=$GITHUB_RUN_NUMBER
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: demo-webui-module
          path: |
            app/build/webui/*.zip
            app/build/webui/update.json
            app/build/webui/changelog.md
      # The zip on a branch too, like native-android: one commit, replaced
      # on each push to main. update.json and changelog.md (module.prop's
      # updateJson) go with it; a GitHub release publishing all three is
      # what the manager's update button reads.
      - name: Publish module branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          src="$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/module" && cp app/build/webui/*.zip app/build/webui/update.json app/build/webui/changelog.md "$RUNNER_TEMP/module/"
          cd "$RUNNER_TEMP/module"
          sha256sum *.zip > SHA256SUMS
          echo "# packed from p0g-stack/demo $src by flutter_p0g $FLUTTER_P0G_REF" >> SHA256SUMS
          git init -q -b module
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "WebUI module from $src"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" module
      # A GitHub release with the zip, update.json and changelog.md:
      # module.prop's updateJson reads releases/latest/download/, and
      # "latest" skips prereleases, so these are plain releases (0.x).
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
        # The tag goes up with git: the releases API refuses this token a
        # tag it creates itself (HTTP 403), while a pushed tag is fine.
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "refs/tags/$TAG"
          cd app/build/webui
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "demo $TAG" --notes-file changelog.md --latest \
            *.zip update.json changelog.md

  # The plain web build, as a developer would make it with flutter_p0g:
  # stock web SDK, the Rust crate as single-threaded wasm, Squadron Web
  # Workers. Checked in headless Chromium from a plain static server (no
  # COOP/COEP), then published on the `web` branch, which GitHub Pages
  # serves at https://p0g-stack.github.io/demo/.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the web branch
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,wasm-pack
      - id: cache
        run: echo "dir=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")/bin/cache/flutter_p0g" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: flutter-p0g-web-${{ env.FLUTTER_P0G_REF }}
      - run: dart pub global activate --source git https://github.com/p0g-stack/flutter_p0g --git-ref "$FLUTTER_P0G_REF"
      - run: flutter_p0g precache --frb
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      # Pages serves the repo under /demo/; the check serves it there too.
      - run: flutter_p0g build web --release --base-href /demo/ -o "$RUNNER_TEMP/site/demo"
        working-directory: app
      - name: Chromium smoke check
        run: |
          cp tool/web_smoke.mjs "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          npm install --no-save --silent playwright@1
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --directory site >/dev/null 2>&1 &
          node web_smoke.mjs http://127.0.0.1:8000/demo/
      - name: Publish web branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          src="$GITHUB_SHA"
          cd "$RUNNER_TEMP/site/demo"
          # wasm-pack puts a `*` .gitignore in pkg/, which would leave the
          # crate's wasm out of the branch.
          find . -name .gitignore -delete
          touch .nojekyll
          git init -q -b web
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "Web build from $src by flutter_p0g $FLUTTER_P0G_REF"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web
