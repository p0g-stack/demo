name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      # The workspace must still be what p0g_app generates (tool/regen.allow).
      - run: dart pub global activate mason_cli 0.1.4
      - run: tool/regen.sh
      # squadron_process + its patched Squadron, then codegen and web workers.
      - run: tool/deps.sh
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      - run: git diff --exit-code
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: core
      - run: dart test
        working-directory: cli
      - run: flutter test
        working-directory: app
      # No CDN: WebUI pages are offline, so CanvasKit ships with the app.
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: app/build/web
