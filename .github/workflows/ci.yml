name: ci

# Validation only: builds and checks every artifact and records them in a
# candidate (candidate.json). Nothing here publishes: no release, tag or
# branch push. promote.yml publishes a successful main push or manual run's
# artifacts, unchanged, once the candidate is qualified.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# flutter_p0g for the module and web jobs: patched frb, build webui, build web.
env:
  FLUTTER_P0G_REF: e739adaef1b6d3c94ec3f13212233591aa4cd8f0
  # flutter-aera's arm64 debug runtime kit (kit-3.47.5, from flutter-aera d1403d6).
  AERA_KIT_URL: https://github.com/p0g-stack/flutter-aera/releases/download/kit-3.47.5/flutter-aera-kit-linux-arm64-debug-3.47.5.tar.xz
  AERA_KIT_SHA256: 12b9a131467a3737a8b1191c69d239039a66498bf638f14095741db74ba44e60

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      # The checks use frb codegen at flutter_p0g's base commit, so the
      # committed pubspec.lock (frb by git) stays as is; the module job
      # below builds with flutter_p0g's patched frb.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand
      - uses: actions/cache@v4
        id: frb
        with:
          path: ~/.frb-codegen
          key: frb-codegen-848e438c561491adcc16cbf8b33bb61e541bd475
      - name: frb codegen
        if: steps.frb.outputs.cache-hit != 'true'
        run: >
          cargo install --locked --root ~/.frb-codegen
          --git https://github.com/fzyzcjy/flutter_rust_bridge
          --rev 848e438c561491adcc16cbf8b33bb61e541bd475
          flutter_rust_bridge_codegen
      - run: echo "$HOME/.frb-codegen/bin" >> "$GITHUB_PATH"
      # The workspace must still be what p0g_app generates (tool/regen.allow).
      - run: dart pub global activate mason_cli 0.1.4
      - run: tool/regen.sh
      # Patched Squadron, pub get, codegen, web/, web workers, format.
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      # Cargo.lock records where frb was patched from (a local path or git).
      - run: git diff --exit-code -- . ':!rust/Cargo.lock'
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: core
      - run: dart test
        working-directory: cli
      - run: flutter test
        working-directory: app
      # No CDN: WebUI pages are offline, so CanvasKit ships with the app.
      - run: flutter build web --release --no-web-resources-cdn
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web
          path: app/build/web
      # The crate for the root process on Android, for flutter_p0g to pack
      # beside the CLI as bin/<abi>/libdemo_native.so.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo ndk -t arm64-v8a -t x86_64 -o "$PWD/../build/native-android" build --release
        working-directory: rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      # The artifact is the native-android branch's content as promote.yml
      # commits it, checksums included.
      - name: Checksums
        run: |
          cd build/native-android
          sha256sum -- */libdemo_native.so > SHA256SUMS
          echo "# built from p0g-stack/demo $GITHUB_SHA" >> SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: demo-native-android
          path: build/native-android

  # The WebUI module, packed by flutter_p0g as a developer would: patched frb
  # (native and single-threaded wasm), flutter-webui, the Dart Android kits,
  # and the Android crate from the build job beside the root process.
  module:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signing: ${{ steps.signing.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,wasm-pack
      - id: cache
        run: echo "dir=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")/bin/cache/flutter_p0g" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: flutter-p0g-${{ env.FLUTTER_P0G_REF }}
      - run: dart pub global activate --source git https://github.com/p0g-stack/flutter_p0g --git-ref "$FLUTTER_P0G_REF"
      - run: flutter_p0g precache --frb --webui --dart-android --dart-android-abi=arm64-v8a,x86_64
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      - uses: actions/download-artifact@v4
        with:
          name: demo-native-android
          path: build/native-android
      # The module's app-plane APK is signed with the stable key (secrets
      # WEBUI_KEYSTORE_B64, a base64 PKCS12 keystore, and
      # WEBUI_KEYSTORE_PASSWORD, store and key password alike). On main the
      # key is required: a main run is a promotion candidate, and an update
      # over an installed module app fails with any other key. Elsewhere
      # (pull requests) flutter_p0g signs with a fresh debug key; such runs
      # are never promotable. The files go in android/ and the runner's temp
      # dir, never webui/: build webui zips everything in webui/ into the
      # public module.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.WEBUI_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WEBUI_KEYSTORE_PASSWORD }}
          # The alias is not secret: v0.1.49 to v0.1.59 were signed through
          # `webui` (certificate SHA-256 03dd05c9...d846, CN=p0g-demo, pinned
          # in .github/webui-signing-cert.sha256). A wrong alias fails the
          # build, and promote.yml checks the APK against that certificate.
          KEY_ALIAS: ${{ secrets.WEBUI_KEY_ALIAS || 'webui' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            if [ "$ON_MAIN" = true ]; then
              echo "::error::WEBUI_KEYSTORE_B64 and WEBUI_KEYSTORE_PASSWORD are required on main: a candidate is never signed with a debug key."
              exit 1
            fi
            echo "::warning::No WEBUI_KEYSTORE_B64/WEBUI_KEYSTORE_PASSWORD: the app-plane APK gets a debug key (not promotable)."
            echo "signing=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          mkdir -p app/android
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > app/android/key.properties
          echo "signing=release" >> "$GITHUB_OUTPUT"
      # Each candidate is a version: 0.<minor> from the app's pubspec, this
      # run's number as patch and versionCode, so the manager's update
      # button sees every promoted one as newer. promote.yml keeps them.
      - id: version
        run: |
          base=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
          echo "name=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      # Two builds: release/ (the GitHub release and its update.json) is
      # arm64-v8a only, what phones run; lab/ (the module branch) is
      # arm64-v8a+x86_64 for the lab's x86_64 emulators. Each directory has
      # its own SHA256SUMS listing only its files.
      - run: >
          flutter_p0g build webui --device-rust-libs="$PWD/../build/native-android"
          --build-name=${{ steps.version.outputs.name }} --build-number="$GITHUB_RUN_NUMBER"
        working-directory: app
      - run: |
          mkdir -p "$RUNNER_TEMP/webui/release"
          cp app/build/webui/*.zip app/build/webui/update.json app/build/webui/changelog.md "$RUNNER_TEMP/webui/release/"
      - run: >
          flutter_p0g build webui --device-rust-libs="$PWD/../build/native-android"
          --abi=arm64-v8a,x86_64
          --build-name=${{ steps.version.outputs.name }} --build-number="$GITHUB_RUN_NUMBER"
        working-directory: app
      - name: release/ and lab/
        run: |
          out=$RUNNER_TEMP/webui
          mkdir -p "$out/lab"
          for z in app/build/webui/*.zip; do
            cp "$z" "$out/lab/$(basename "$z" .zip)-arm64-v8a+x86_64.zip"
          done
          # module.prop's updateJson reads the release; the branch carries
          # the same update.json and changelog.md beside its zip.
          cp "$out/release/update.json" "$out/release/changelog.md" "$out/lab/"
          cd "$out/release"
          { sha256sum ./*.zip update.json changelog.md
            echo "# release assets, arm64-v8a (update.json points here), packed from p0g-stack/demo $GITHUB_SHA by flutter_p0g $FLUTTER_P0G_REF"
          } > SHA256SUMS
          cd "$out/lab"
          { sha256sum ./*.zip update.json changelog.md
            echo "# module branch, arm64-v8a+x86_64 (lab emulators), packed from p0g-stack/demo $GITHUB_SHA by flutter_p0g $FLUTTER_P0G_REF"
          } > SHA256SUMS
          sed -i 's#  \./#  #' "$out/release/SHA256SUMS" "$out/lab/SHA256SUMS"
          cat "$out/release/SHA256SUMS" "$out/lab/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-webui-module
          path: ${{ runner.temp }}/webui/

  # The AERA plugin (.aerap), packed by flutter_p0g as a developer would:
  # `flutter build bundle` for linux-arm64 with flutter-aera's released
  # runtime kit (kit-3.47.5; only a debug kit is released so far, so this is
  # a debug build), with the demo crate cross-built for aarch64 Linux in
  # usr/lib. The artifact is the `aera` branch's content and, as
  # Flutter-Demo-<version>.aerap, a release asset (promote.yml).
  aera:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      kit_commit: ${{ steps.kit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-unknown-linux-gnu
      # The crate for AERA's aarch64 Linux, which build aera packs into
      # usr/lib beside the kit's glibc.
      - run: sudo apt-get install -y -q gcc-aarch64-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,wasm-pack
      - id: cache
        run: echo "dir=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")/bin/cache/flutter_p0g" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: flutter-p0g-aera-${{ env.FLUTTER_P0G_REF }}
      - run: dart pub global activate --source git https://github.com/p0g-stack/flutter_p0g --git-ref "$FLUTTER_P0G_REF"
      # --frb: bootstrap's tool/rust.sh generates the Dart bindings the app
      # compiles against, whichever target it is built for.
      # The kit by hash: kit-3.47.5 is clobbered on each republish, so the
      # sha256 (PINS.md) is what says which build this .aerap carries. A
      # republished kit fails here until AERA_KIT_SHA256 moves to it.
      - run: >
          flutter_p0g precache --frb
          --aera-kit="$AERA_KIT_URL"
          --aera-kit-sha256="$AERA_KIT_SHA256"
      # The flutter-aera commit that built the installed kit (its kit.json),
      # for the candidate: promote.yml requires the Kit run at that commit.
      - id: kit
        run: |
          meta=${{ steps.cache.outputs.dir }}/aera-kit/linux-arm64-debug/kit.json
          commit=$(jq -er .flutter_aera_commit "$meta")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      # Same version as the module: 0.<minor>.<run number>. build aera takes
      # `build bundle` flags, which have no --build-name, so the pubspec is
      # stamped for this build.
      - id: version
        run: |
          base=$(sed -n 's/^version: *\([0-9]*\.[0-9]*\)\..*/\1/p' app/pubspec.yaml)
          echo "name=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          sed -i "s/^version: .*/version: $base.$GITHUB_RUN_NUMBER+$GITHUB_RUN_NUMBER/" app/pubspec.yaml
      - run: flutter_p0g build aera --debug
        working-directory: app
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # AERA-SHA256SUMS, not SHA256SUMS: on the release it sits beside the
      # module's release/SHA256SUMS.
      - name: Name the package
        run: |
          mkdir -p "$RUNNER_TEMP/aera"
          cp app/build/aera/demo-${{ steps.version.outputs.name }}.aerap \
            "$RUNNER_TEMP/aera/Flutter-Demo-${{ steps.version.outputs.name }}.aerap"
          cp app/build/aera/plugin.json "$RUNNER_TEMP/aera/"
          cd "$RUNNER_TEMP/aera"
          sha256sum ./*.aerap plugin.json | sed 's#  \./#  #' > AERA-SHA256SUMS
          echo "# packed from p0g-stack/demo $GITHUB_SHA by flutter_p0g $FLUTTER_P0G_REF (kit-3.47.5 debug, sha256 $AERA_KIT_SHA256, flutter-aera ${{ steps.kit.outputs.commit }})" >> AERA-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: demo-aera
          path: ${{ runner.temp }}/aera/

  # The plain web build, as a developer would make it with flutter_p0g:
  # stock web SDK, the Rust crate as single-threaded wasm, Squadron Web
  # Workers. Checked in headless Chromium from a plain static server (no
  # COOP/COEP). The demo-web-site artifact is the `web` branch's content,
  # which GitHub Pages serves at https://p0g-stack.github.io/demo/.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-expand,wasm-pack
      - id: cache
        run: echo "dir=$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")/bin/cache/flutter_p0g" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: flutter-p0g-web-${{ env.FLUTTER_P0G_REF }}
      - run: dart pub global activate --source git https://github.com/p0g-stack/flutter_p0g --git-ref "$FLUTTER_P0G_REF"
      - run: flutter_p0g precache --frb
      - run: bash tool/bootstrap.sh
        env:
          PLATFORMS: web
      # Pages serves the repo under /demo/; the check serves it there too.
      - run: flutter_p0g build web --release --base-href /demo/ -o "$RUNNER_TEMP/site/demo"
        working-directory: app
      - name: Chromium smoke check
        run: |
          cp tool/web_smoke.mjs "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          npm install --no-save --silent playwright@1
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --directory site >/dev/null 2>&1 &
          node web_smoke.mjs http://127.0.0.1:8000/demo/
      # As the branch needs it: wasm-pack puts a `*` .gitignore in pkg/,
      # which would leave the crate's wasm out of the branch, and Pages
      # must not run Jekyll.
      - name: Site as published
        run: |
          cd "$RUNNER_TEMP/site/demo"
          find . -name .gitignore -delete
          touch .nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: demo-web-site
          path: ${{ runner.temp }}/site/demo/
          include-hidden-files: true

  # The candidate: what this run built, identified from the artifact bytes
  # themselves. promote.yml downloads the same artifacts and refuses any
  # mismatch. Pull requests and debug-signed runs are recorded but are
  # never promotable.
  candidate:
    needs: [build, module, aera, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo-native-android
          path: ${{ runner.temp }}/a/demo-native-android
      - uses: actions/download-artifact@v4
        with:
          name: demo-webui-module
          path: ${{ runner.temp }}/a/demo-webui-module
      - uses: actions/download-artifact@v4
        with:
          name: demo-aera
          path: ${{ runner.temp }}/a/demo-aera
      - uses: actions/download-artifact@v4
        with:
          name: demo-web-site
          path: ${{ runner.temp }}/a/demo-web-site
      - name: candidate.json
        env:
          VERSION: ${{ needs.module.outputs.version }}
          AERA_VERSION: ${{ needs.aera.outputs.version }}
          SIGNING: ${{ needs.module.outputs.signing }}
          KIT_COMMIT: ${{ needs.aera.outputs.kit_commit }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          a=$RUNNER_TEMP/a
          [ "$VERSION" = "$AERA_VERSION" ] || { echo "::error::module $VERSION and aera $AERA_VERSION versions differ"; exit 1; }
          rel=$a/demo-webui-module/release; lab=$a/demo-webui-module/lab
          (cd "$rel" && sha256sum -c SHA256SUMS)
          (cd "$lab" && sha256sum -c SHA256SUMS)
          (cd "$a/demo-aera" && sha256sum -c AERA-SHA256SUMS)
          (cd "$a/demo-native-android" && sha256sum -c SHA256SUMS)
          release_zip=$rel/demo-v$VERSION.zip
          lab_zip=$lab/demo-v$VERSION-arm64-v8a+x86_64.zip
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          export APKSIGNER
          cert=$(tool/apk_cert.sh "$release_zip")
          lab_cert=$(tool/apk_cert.sh "$lab_zip")
          [ "$cert" = "$lab_cert" ] || { echo "::error::release ($cert) and lab ($lab_cert) APK certificates differ"; exit 1; }
          pinned=$(tr -d '[:space:]' < .github/webui-signing-cert.sha256)
          promotable=false
          if [ "$ON_MAIN" = true ]; then
            [ "$SIGNING" = release ] || { echo "::error::main candidate without the release key"; exit 1; }
            [ "$cert" = "$pinned" ] || { echo "::error::app-plane APK certificate $cert is not the pinned $pinned"; exit 1; }
            promotable=true
          fi
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          mkdir -p "$RUNNER_TEMP/candidate"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg event "$GITHUB_EVENT_NAME" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_number "$GITHUB_RUN_NUMBER" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg version "$VERSION" --arg signing "$SIGNING" --arg cert "$cert" --argjson promotable "$promotable" \
            --arg flutter_p0g "$FLUTTER_P0G_REF" --arg kit_url "$AERA_KIT_URL" --arg kit_sha256 "$AERA_KIT_SHA256" --arg kit_commit "$KIT_COMMIT" \
            --arg native "$(tool/bundle_digest.sh "$a/demo-native-android")" \
            --arg module "$(tool/bundle_digest.sh "$a/demo-webui-module")" \
            --arg aera "$(tool/bundle_digest.sh "$a/demo-aera")" \
            --arg web "$(tool/bundle_digest.sh "$a/demo-web-site")" \
            --arg release_zip "$(basename "$release_zip")" --arg release_zip_sha256 "$(sha "$release_zip")" \
            --arg lab_zip "$(basename "$lab_zip")" --arg lab_zip_sha256 "$(sha "$lab_zip")" \
            --arg aerap "Flutter-Demo-$VERSION.aerap" --arg aerap_sha256 "$(sha "$a/demo-aera/Flutter-Demo-$VERSION.aerap")" \
            '{candidate: 1, repository: $repo, source_sha: $sha, ref: $ref, event: $event,
              source_run_id: $run_id, source_run_number: $run_number, source_run_attempt: $run_attempt,
              version: $version, promotable: $promotable, flutter_p0g_ref: $flutter_p0g,
              apk_signing: $signing, apk_signing_cert_sha256: $cert,
              aera_kit: {url: $kit_url, sha256: $kit_sha256, flutter_aera_commit: $kit_commit},
              bundles: {"demo-native-android": $native, "demo-webui-module": $module, "demo-aera": $aera, "demo-web-site": $web},
              module_zips: {release: {name: $release_zip, sha256: $release_zip_sha256}, lab: {name: $lab_zip, sha256: $lab_zip_sha256}},
              aerap: {name: $aerap, sha256: $aerap_sha256}}' \
            > "$RUNNER_TEMP/candidate/candidate.json"
          cat "$RUNNER_TEMP/candidate/candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-candidate
          path: ${{ runner.temp }}/candidate/candidate.json
