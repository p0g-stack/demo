name: demo_core
description: The demo's pure Dart core (no package:flutter); runs in the app, its workers and the CLI.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  squadron: 7.4.4
  # Pinned; tool/deps.sh fetches the same commit and pubspec_overrides.yaml
  # points at it, with the patched Squadron squadron_process requires.
  squadron_process:
    git:
      url: https://github.com/p0g-stack/squadron_process
      ref: b4a599c2bca574d040df1d6404553672d3f15f28

dev_dependencies:
  build_runner: ^2.16.0
  lints: ^6.0.0
  squadron_builder: ^9.3.2
  test: ^1.26.0
