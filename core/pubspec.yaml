name: demo_core
description: The logic of demo. Pure Dart (no package:flutter); runs in the app, its workers and the CLI.
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  logging: ^1.3.0
  squadron: ^7.4.4
  web: ^1.1.0
  squadron_process:
    git:
      url: https://github.com/p0g-stack/squadron_process
      ref: 52ee2f66b0928dbcb2a33a39a04d9f7e72f697f8
  flutter_webui_client:
    git:
      url: https://github.com/p0g-stack/flutter-webui
      path: packages/flutter_webui_client
      ref: 3049dc94adb1df919ccdab1ab305759601a772c3
  # flutter_p0g's frb base (848e438, master after 2.14.0-beta.2): the
  # bindings it generates need this frb_dart, not the beta.2 release.
  # tool/rust.sh overrides it with flutter_p0g's patched copy.
  flutter_rust_bridge:
    git:
      url: https://github.com/fzyzcjy/flutter_rust_bridge
      path: frb_dart
      ref: 848e438c561491adcc16cbf8b33bb61e541bd475

dev_dependencies:
  build_runner: ^2.16.1
  lints: ^6.1.0
  squadron_builder: ^9.3.2
  test: ^1.31.1
